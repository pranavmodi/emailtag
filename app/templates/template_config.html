<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorespond Template Configuration</title>

    <!-- Quill.js Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .menu-bar {
            background: white;
            display: flex;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .menu-item {
            flex: 1;
            padding: 20px 30px;
            color: #333;
            text-decoration: none;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #f5f7fa;
            transform: translateY(-2px);
        }

        .menu-item.active {
            background: #f0f4ff;
            border-bottom-color: #667eea;
        }

        .menu-item-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-item-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .template-selector {
            margin-bottom: 30px;
        }

        .template-selector label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .template-selector select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .template-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .template-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .template-info h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        .template-info p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .placeholders {
            margin-top: 15px;
        }

        .placeholders h4 {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .placeholder-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .placeholder-tag {
            background: #e7e9fc;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }

        .editor-section {
            margin-bottom: 25px;
        }

        .editor-section h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        #editor {
            height: 400px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .status-message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .metadata {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .metadata-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .metadata-label {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <a href="/settings" class="menu-item">
            <div class="menu-item-title">⚙️ System Settings</div>
            <div class="menu-item-subtitle">Configure email processing behavior</div>
        </a>
        <a href="/template-config" class="menu-item active">
            <div class="menu-item-title">📝 Autorespond Templates</div>
            <div class="menu-item-subtitle">Edit message templates</div>
        </a>
        <a href="/tag-statistics" class="menu-item">
            <div class="menu-item-title">📊 Tag Statistics</div>
            <div class="menu-item-subtitle">Analyze tag retention and changes</div>
        </a>
    </div>

    <div class="container">
        <h1 class="page-title">Autorespond Template Configuration</h1>

        <div class="content-card">
            <div id="status-message" class="status-message"></div>

            <!-- Template Selector -->
            <div class="template-selector">
                <label for="template-select">Select Template to Edit:</label>
                <select id="template-select" onchange="loadTemplate()">
                    <option value="">-- Select a template --</option>
                    <optgroup label="Appointment Status Request">
                        <option value="apt_status_req_found">Appointment Found (Detailed View)</option>
                        <option value="apt_status_req_not_found">Appointment Not Found</option>
                        <option value="apt_status_req_db_error">Database Error</option>
                    </optgroup>
                </select>
            </div>

            <div id="template-content" style="display: none;">
                <!-- Template Info -->
                <div class="template-info">
                    <h3 id="template-name"></h3>
                    <p id="template-description"></p>

                    <div class="placeholders">
                        <h4>Available Placeholders:</h4>
                        <div id="placeholder-list" class="placeholder-list"></div>
                    </div>
                </div>

                <!-- Editor Section -->
                <div class="editor-section">
                    <h3>Template Content</h3>
                    <div id="editor"></div>
                </div>

                <!-- Metadata -->
                <div id="metadata" class="metadata" style="display: none;">
                    <div class="metadata-row">
                        <span class="metadata-label">Last Updated:</span>
                        <span id="last-updated"></span>
                    </div>
                    <div class="metadata-row">
                        <span class="metadata-label">Updated By:</span>
                        <span id="updated-by"></span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="resetTemplate()">Reset Changes</button>
                    <button class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading template...</p>
            </div>
        </div>
    </div>

    <script>
        let quill;
        let currentTemplate = null;
        let originalContent = '';

        // Template definitions with their metadata
        const templateDefinitions = {
            'apt_status_req_found': {
                key: 'apt_status_req_found',
                name: 'Appointment Found - Detailed View',
                description: 'This template is used when an appointment is found for the patient. It displays detailed information including exam details, location, and access links.',
                placeholders: [
                    '{patient_id_confirmed}',
                    '{no_show_policy}',
                    '{studies_table_rows}',
                    '{personal_injury_info}',
                    '{bills_link}',
                    '{reports_link}'
                ],
                default: `Patient ID: {patient_id_confirmed}<br/><br/>
<b>Our direct scheduling phone # is 800-558-2223 and we can assist with directions, rescheduling, canceling, or any other scheduling-related questions.</b><br/>
{no_show_policy}<br/><br/>
Here is a summary of the patient's exams we currently have entered into our system:<table border="1" style="border-collapse: collapse; width: 100%;"><thead><tr><th style="border: 1px solid black; padding: 8px; text-align: left;">Study ID</th><th style="border: 1px solid black; padding: 8px; text-align: left;">Exam Description</th><th style="border: 1px solid black; padding: 8px; text-align: left;">Status</th><th style="border: 1px solid black; padding: 8px; text-align: left;">Study Date/Time</th><th style="border: 1px solid black; padding: 8px; text-align: left;">Location</th><th style="border: 1px solid black; padding: 8px; text-align: left;">MRI Type</th><th style="border: 1px solid black; padding: 8px; text-align: left;">Images Available</th><th style="border: 1px solid black; padding: 8px; text-align: left;">Report Available</th></tr></thead><tbody>{studies_table_rows}</tbody></table>
<br/>
{personal_injury_info}
Access bills, appointment times, and e-sign liens (Click request login if you don't have an account): <a href="{bills_link}">Click Here</a><br/>
Access reports & images (Request login here for reports): <a href="{reports_link}">Click Here</a><br/>`
            },
            'apt_status_req_not_found': {
                key: 'apt_status_req_not_found',
                name: 'Appointment Not Found',
                description: 'This template is used when a patient ID is found but no appointments exist. It prompts for additional details.',
                placeholders: ['{patient_id}'],
                default: "We found your Patient ID: {patient_id}, but could not find any upcoming appointments. If you believe this is an error, please provide the approximate date and type of your exam so our team can investigate further. A member of our team will also review this request."
            },
            'apt_status_req_db_error': {
                key: 'apt_status_req_db_error',
                name: 'Database Error',
                description: 'This template is displayed when a technical error occurs while fetching appointment details.',
                placeholders: ['{patient_id}'],
                default: "We encountered a technical difficulty while trying to fetch your appointment details for Patient ID: {patient_id}. Our team has been notified and will look into this."
            }
        };

        // Initialize Quill editor
        document.addEventListener('DOMContentLoaded', function() {
            quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'header': 1 }, { 'header': 2 }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'indent': '-1'}, { 'indent': '+1' }],
                        [{ 'size': ['small', false, 'large', 'huge'] }],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'align': [] }],
                        ['link'],
                        ['clean']
                    ]
                }
            });
        });

        async function loadTemplate() {
            const select = document.getElementById('template-select');
            const templateKey = select.value;

            if (!templateKey) {
                document.getElementById('template-content').style.display = 'none';
                return;
            }

            const definition = templateDefinitions[templateKey];
            if (!definition) return;

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('template-content').style.display = 'none';
            hideStatusMessage();

            try {
                // Try to fetch from database
                const response = await fetch(`/templates/${templateKey}`);

                if (response.ok) {
                    // Template exists in database
                    currentTemplate = await response.json();
                    originalContent = currentTemplate.template_body;

                    // Show metadata
                    document.getElementById('metadata').style.display = 'block';
                    document.getElementById('last-updated').textContent = new Date(currentTemplate.updated_at).toLocaleString();
                    document.getElementById('updated-by').textContent = currentTemplate.updated_by || 'Unknown';
                } else if (response.status === 404) {
                    // Template doesn't exist in database yet, use default
                    currentTemplate = null;
                    originalContent = definition.default;
                    document.getElementById('metadata').style.display = 'none';
                } else {
                    throw new Error('Failed to fetch template');
                }

                // Update UI
                document.getElementById('template-name').textContent = definition.name;
                document.getElementById('template-description').textContent = definition.description;

                // Update placeholders
                const placeholderList = document.getElementById('placeholder-list');
                placeholderList.innerHTML = '';
                definition.placeholders.forEach(placeholder => {
                    const tag = document.createElement('span');
                    tag.className = 'placeholder-tag';
                    tag.textContent = placeholder;
                    placeholderList.appendChild(tag);
                });

                // Set editor content
                quill.root.innerHTML = originalContent;

                // Show template content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('template-content').style.display = 'block';

            } catch (error) {
                console.error('Error loading template:', error);
                showStatusMessage('Failed to load template: ' + error.message, 'error');
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function saveTemplate() {
            const select = document.getElementById('template-select');
            const templateKey = select.value;

            if (!templateKey) return;

            const definition = templateDefinitions[templateKey];
            const content = quill.root.innerHTML;

            // Get username for audit trail (you can enhance this with actual authentication)
            const updatedBy = prompt('Enter your name for the audit log:') || 'Web User';

            try {
                let response;

                if (currentTemplate) {
                    // Update existing template
                    response = await fetch(`/templates/${templateKey}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            template_body: content,
                            template_name: definition.name,
                            description: definition.description,
                            updated_by: updatedBy
                        })
                    });
                } else {
                    // Create new template
                    response = await fetch('/templates', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            template_key: templateKey,
                            template_name: definition.name,
                            template_body: content,
                            description: definition.description,
                            updated_by: updatedBy
                        })
                    });
                }

                if (response.ok) {
                    const result = await response.json();
                    currentTemplate = result;
                    originalContent = content;

                    // Update metadata
                    document.getElementById('metadata').style.display = 'block';
                    document.getElementById('last-updated').textContent = new Date(result.updated_at).toLocaleString();
                    document.getElementById('updated-by').textContent = result.updated_by || 'Unknown';

                    showStatusMessage('Template saved successfully!', 'success');
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to save template');
                }

            } catch (error) {
                console.error('Error saving template:', error);
                showStatusMessage('Failed to save template: ' + error.message, 'error');
            }
        }

        function resetTemplate() {
            if (confirm('Are you sure you want to reset your changes? This will restore the template to its last saved state.')) {
                quill.root.innerHTML = originalContent;
                showStatusMessage('Changes have been reset', 'success');
            }
        }

        function showStatusMessage(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type;
            statusDiv.style.display = 'block';

            // Auto-hide after 5 seconds
            setTimeout(() => {
                hideStatusMessage();
            }, 5000);
        }

        function hideStatusMessage() {
            const statusDiv = document.getElementById('status-message');
            statusDiv.style.display = 'none';
        }
    </script>
</body>
</html>
