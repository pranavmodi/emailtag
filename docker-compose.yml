version: '3.8'

services:
  # ───────────────────────────────────────────────
  # FastAPI backend (port 8444)
  # ───────────────────────────────────────────────
  web:
    build: .
    container_name: emailtag-web
    network_mode: host
    env_file:
      - .env
    restart: unless-stopped

  # ───────────────────────────────────────────────
  # Celery worker: all queues
  # ───────────────────────────────────────────────
  worker:
    build: .
    container_name: emailtag-worker
    network_mode: host
    env_file:
      - .env
    command: celery -A app.tasks.worker worker -l info -Q emails,tagging,processing,ocr
    restart: unless-stopped

  # ───────────────────────────────────────────────
  # Next.js settings frontend (port 3000)
  # ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/settings2
      dockerfile: Dockerfile
    container_name: emailtag-frontend
    network_mode: host
    restart: unless-stopped

  # ───────────────────────────────────────────────
  # Flower - Celery monitoring (port 5555)
  # ───────────────────────────────────────────────
  flower:
    build: .
    container_name: emailtag-flower
    network_mode: host
    env_file:
      - .env
    command: celery -A app.tasks.worker flower --port=5555
    restart: unless-stopped

  # ───────────────────────────────────────────────
  # PreciseMCP server (port 8001)
  # ───────────────────────────────────────────────
  mcp:
    build:
      context: ../precisemcp
      dockerfile: Dockerfile
    container_name: precisemcp
    network_mode: host
    env_file:
      - ../precisemcp/.env
    environment:
      - PORT=8001
    restart: unless-stopped
