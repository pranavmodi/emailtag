version: '3.8'

services:
  web:
    build: .
    ports:
      - "8444:8444"  # HTTPS port
    volumes:
      - .:/app
      - ./certs:/app/certs  # Mount SSL certificates
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    command: >
      bash -c "
      if [ -f \"$$SSL_CERT_FILE\" ] && [ -f \"$$SSL_KEY_FILE\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port $$PORT --ssl-keyfile $$SSL_KEY_FILE --ssl-certfile $$SSL_CERT_FILE;
      else
        uvicorn app.main:app --host 0.0.0.0 --port $$PORT;
      fi
      "

  worker:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    command: celery -A app.tasks.worker worker -l info -Q emails,tagging

  flower:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - worker
    command: celery -A app.tasks.worker flower --port=5555

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=emailtag
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

volumes:
  postgres_data: 